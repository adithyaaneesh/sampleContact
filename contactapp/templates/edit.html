{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Edit</title>
</head>
<body>
    <h2>Edit Contact</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Image:</label>
        <img src="{{ contact.profile_image.url }}" width="100"><br><br>
        <label>New Image:</label>
        <input type="file" name="profile_image" ><br><br>
        <label>Full Name:</label>
        <input type="text" name="fname" value="{{ contact.firstname }}" required><br><br>
        <label>Email:</label>
        <input type="email" name="email" value="{{ contact.email }}"><br><br>
        <label>Phone Number:</label>
        <input type="text" name="phonenum" value="{{ contact.phonenumber }}" required><br><br>
        <a href="{% url 'home' %}">Cancel</a>
        <button type="submit">Save Changes</button>
    </form>
</body>
</html>
